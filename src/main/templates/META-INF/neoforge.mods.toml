# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here: https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml"

# A version range to match for said mod loader
loaderVersion="${loader_version_range}"

# The license for your mod
license="${mod_license}"

[[mods]]

modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

description='''
Example mod description.
'''

# NeoForge dependency
[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

# Minecraft dependency
[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Farmer's Delight dependency, required by the bronze knife
[[dependencies."${mod_id}"]]
modId="farmersdelight"
type="required"
versionRange="[1.3.4,)"
ordering="NONE"
side="BOTH"

# Create dependency
[[dependencies."${mod_id}"]]
modId="create"
type="required"
versionRange="[${create_version},)"
ordering="NONE"
side="BOTH"

# Supplementaries dependency
[[dependencies."${mod_id}"]]
modId="supplementaries"
type="required"
versionRange="[${supplementaries_version},)"
ordering="NONE"
side="BOTH"

# Create: Aeronautics supplies the Simulated portable-engine implementation
[[dependencies."${mod_id}"]]
modId="aeronautics"
type="required"
versionRange="[1.3.1,)"
ordering="AFTER"
side="BOTH"

# LambDynamicLights dependency
[[dependencies."${mod_id}"]]
modId="lambdynlights"
type="required"
versionRange="[4.5.0,)"
ordering="NONE"
side="CLIENT"

# No Man's Land supplies honey cauldrons and hive taps used by the Wax Golem
[[dependencies."${mod_id}"]]
modId="nomansland"
type="required"
versionRange="[2.0.0,3.0.0)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="poptartcore.mixins.json"

